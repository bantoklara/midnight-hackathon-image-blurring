# TrueMask proof server.
#
#   docker compose -f proof-server/docker-compose.yml up -d
#   curl http://localhost:6300/health   ->  {"status":"ok", ...}
#
# This is the only piece of infrastructure needed to GENERATE proofs. Submitting
# them on-chain additionally needs a node and an indexer — see README.md.
services:
  proof-server:
    image: midnightntwrk/proof-server:latest
    container_name: truemask-proof-server
    ports:
      - "6300:6300"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6300/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
